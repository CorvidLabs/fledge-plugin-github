[plugin]
name = "fledge-plugin-github"
version = "0.1.0"
description = "GitHub commands for fledge — view CI checks, issues, and pull requests via the gh CLI"
author = "0xLeif"
license = "MIT"

[[commands]]
name = "checks"
description = "View CI/CD check status for a branch"
binary = "bin/fledge-checks"

[[commands]]
name = "issues"
description = "List and view GitHub issues"
binary = "bin/fledge-issues"

[[commands]]
name = "prs"
description = "List and view GitHub pull requests"
binary = "bin/fledge-prs"
